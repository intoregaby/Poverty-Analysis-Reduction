name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    name: engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine requirements
        run: python -m pip install -r engine/requirements.txt
      - name: Run engine suite
        run: python -m unittest discover -s engine/tests -t engine/tests -v

  web:
    name: web tests, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  acceptance:
    name: acceptance report (not a release)
    runs-on: ubuntu-latest
    needs: [engine, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: python -m pip install -r engine/requirements.txt
      # The completion gate exits non-zero until real evidence, infrastructure and named human
      # approvals exist. It is reported here but the blocking jobs above are what gate a merge;
      # a green run of this job is still required before any release.
      - name: Compute completion gate
        continue-on-error: true
        run: python scripts/verify_engine_completion.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-run
          path: docs/implementation/evidence/verification_run.json
          if-no-files-found: warn
